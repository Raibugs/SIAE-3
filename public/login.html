<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Gestión UAS</title><link rel="stylesheet" href="/css/estilo.css"></head>
<body class="portada-pagina login-gestion"><main class="portada-centro"><section class="tarjeta-portada tarjeta-login"><div class="logos-portada"><img src="/img/logo-uas.png" alt="UAS"><img src="/img/logo-fic.png" alt="Facultad de Informática"></div><p class="nombre-universidad">Universidad Autónoma de Sinaloa</p><p class="nombre-facultad">Facultad de Informática</p><div class="separador-portada"></div><span class="eyebrow">SISTEMA DE GESTIÓN ACADÉMICA</span><h1 id="tituloLogin">Iniciar sesión</h1><p class="descripcion-portada" id="descripcionLogin">Accede al portal de acuerdo con tu función.</p>
  <form id="formLogin" class="formulario-login"><label for="tipoAcceso">Tipo de acceso</label><select id="tipoAcceso"><option value="profesor">Maestro</option><option value="administrador">Administrador</option></select><label for="cuenta">Número de trabajador / usuario</label><input id="cuenta" autocomplete="username" required placeholder="Número de trabajador"><label for="nip">Contraseña</label><input id="nip" type="password" autocomplete="current-password" required placeholder="Contraseña asignada"><button class="boton azul boton-inicio" type="submit">INGRESAR</button><p id="mensajeLogin" role="status"></p><p class="enlace-registro">¿Eres maestro y aún no tienes cuenta? <a class="enlace-texto" href="/registro.html">Regístrate aquí</a></p></form>
  <a class="volver-inicio" href="/">Regresar al inicio</a></section></main><script src="/js/login.js?v=20260929c"></script></body></html>
